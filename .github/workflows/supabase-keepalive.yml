# Supabase Keep-Alive Scheduled Workflow
#
# Prevents Supabase Free Tier automatic project pausing after 7 days of PostgreSQL
# database inactivity by executing lightweight PostgREST queries every 2 days.
#
# Why PostgREST (/rest/v1/...) instead of Auth or Storage?
# Supabase only counts live PostgreSQL queries as project database activity.
# Auth (/auth/v1), Storage (/storage/v1), and external Cloudflare R2 proxy requests
# do NOT keep a paused-risk Postgres instance awake on their own.
#
# Recommended one-time SQL in Supabase SQL Editor so pings always get HTTP 200:
#   create table if not exists public.keep_alive (
#     id bigint generated by default as identity primary key,
#     name text default 'ping',
#     created_at timestamptz default now()
#   );
#   insert into public.keep_alive (name) values ('lootdrop-heartbeat');
#   grant usage on schema public to anon, authenticated;
#   grant select on public.keep_alive to anon, authenticated;
#   alter table public.keep_alive enable row level security;
#   create policy "Public read keep_alive" on public.keep_alive for select using (true);

name: Supabase PostgreSQL Keep-Alive

on:
  schedule:
    # Runs at 06:00 UTC every 2 days (well inside Supabase's 7-day inactivity limit)
    - cron: '0 6 */2 * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  keepalive:
    name: Ping Supabase PostgREST DB
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Execute PostgREST Keep-Alive Queries
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || 'https://imcwutouksxeevmofcmn.supabase.co' }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY || 'sb_publishable_htD9aXXk0QHjhG_ifS3nYg_kjUp7osD' }}
        run: |
          set -euo pipefail
          BASE_URL="$(printf '%s' "$SUPABASE_URL" | tr -d '[:space:]')"
          BASE_URL="${BASE_URL%/}"
          ANON_KEY="$(printf '%s' "$SUPABASE_ANON_KEY" | tr -d '[:space:]')"

          if [ -z "$BASE_URL" ] || [ -z "$ANON_KEY" ]; then
            echo "::error::SUPABASE_URL or SUPABASE_ANON_KEY is empty"
            exit 1
          fi

          # Modern Supabase publishable/secret keys (sb_publishable_... / sb_secret_...)
          # are NOT JWTs. Passing them in `Authorization: Bearer` causes PostgREST to
          # fail JWT decoding and return HTTP 401. Only include Authorization for JWTs.
          AUTH_ARGS=()
          if [[ "$ANON_KEY" != sb_* ]]; then
            AUTH_ARGS=(-H "Authorization: Bearer $ANON_KEY")
          fi

          ping_endpoint() {
            local label="$1"
            local url="$2"
            local extra_header="${3:-}"
            local extra_args=()
            if [ -n "$extra_header" ]; then
              extra_args=(-H "$extra_header")
            fi

            local code
            code=$(curl -sS -o /tmp/supa_resp.txt -w "%{http_code}" -X GET \
              "$url" \
              -H "apikey: $ANON_KEY" \
              -H "Accept: application/json" \
              ${AUTH_ARGS[@]+"${AUTH_ARGS[@]}"} \
              ${extra_args[@]+"${extra_args[@]}"} || echo "000")

            echo "[$label] HTTP $code -> $url"
            if [[ "$code" =~ ^[0-9]+$ ]] && { [ "$code" = "401" ] || [ "$code" = "403" ] || [ "$code" -ge 500 ]; }; then
              local body_preview
              body_preview=$(head -c 300 /tmp/supa_resp.txt | tr '\n' ' ' || true)
              if [ -n "$body_preview" ]; then
                echo "[$label] Response: $body_preview"
              fi
            fi
            echo "$code" > /tmp/last_code.txt
          }

          db_alive=0

          # 1. Query existing backups table (executes PostgreSQL query plan + count/RLS check)
          ping_endpoint "lootdrop_backups" \
            "$BASE_URL/rest/v1/lootdrop_backups?select=account_id&limit=1" \
            "Prefer: count=exact"
          code1=$(cat /tmp/last_code.txt)
          if [ "$code1" -ge 200 ] && [ "$code1" -lt 400 ]; then
            db_alive=1
          fi

          # 2. Query keep_alive heartbeat table
          ping_endpoint "keep_alive" \
            "$BASE_URL/rest/v1/keep_alive?select=id&limit=1" \
            "Prefer: count=exact"
          code2=$(cat /tmp/last_code.txt)
          if [ "$code2" -ge 200 ] && [ "$code2" -lt 400 ]; then
            db_alive=1
          fi

          # 3. Fallback OpenAPI schema check only if table pings did not succeed (requires secret/service_role key on newer Supabase projects)
          code3="skipped"
          if [ "$db_alive" -eq 0 ]; then
            ping_endpoint "postgrest_schema" "$BASE_URL/rest/v1/"
            code3=$(cat /tmp/last_code.txt)
            if [ "$code3" -ge 200 ] && [ "$code3" -lt 400 ]; then
              db_alive=1
            fi
          fi

          if [ "$code1" = "000" ] && [ "$code2" = "000" ] && [ "$code3" = "000" ]; then
            echo "::error::Failed to reach Supabase instance at $BASE_URL (network/DNS error)"
            exit 1
          fi

          if [ "$code1" -ge 500 ] || [ "$code2" -ge 500 ] || { [ "$code3" != "skipped" ] && [ "$code3" -ge 500 ]; }; then
            echo "::error::Supabase returned HTTP 5xx (backups=$code1, keep_alive=$code2, schema=$code3)"
            exit 1
          fi

          if [ "$db_alive" -eq 0 ]; then
            echo "::error::No 2xx/3xx PostgREST response received (backups=$code1, keep_alive=$code2, schema=$code3)"
            exit 1
          fi

          echo "Supabase PostgreSQL keep-alive succeeded! (backups=$code1, keep_alive=$code2, schema=$code3)"
